services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incident
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-synthetic-demo}
    volumes:
      - incident_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U incident]
      interval: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8103:8103"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: incident
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-synthetic-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  incident_data:
